allowBuilds:
  '@firebase/util': true
  core-js: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# jwks-rsa (dependencia transitiva de firebase-admin/auth) todavia usa
# require() sobre jose, pero jose@6 dejo de tener build CommonJS (ESM puro).
# Eso rompe en el bundling serverless de Vercel con ERR_REQUIRE_ESM. Se fija
# jose en la ultima mayor con build CJS hasta que jwks-rsa actualice su import.
overrides:
  jose: "^5"
